<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaunchPad</title>
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <div class="container">
    <header class="header">
      <h1>LaunchPad</h1>
      <button id="editModeBtn" class="icon-btn" title="Edit Mode" aria-label="Edit shortcuts" aria-pressed="false">
        <span class="material-icon icon-edit" aria-hidden="true"></span>
      </button>
    </header>

    <div id="popupStatus" class="popup-status" role="status" aria-live="polite"></div>
    <div id="launchpad" class="launchpad"></div>

    <form id="addForm" class="add-form hidden" novalidate aria-labelledby="shortcutFormTitle">
      <div id="shortcutFormTitle" class="add-title">Add shortcut</div>
      <div class="field-group">
        <label for="siteName">Name</label>
        <input type="text" id="siteName" required autocomplete="off" aria-describedby="siteNameError" />
        <span id="siteNameError" class="field-error" aria-live="polite"></span>
      </div>
      <div class="field-group">
        <label for="siteUrl">URL</label>
        <input type="url" id="siteUrl" required placeholder="example.com" aria-describedby="siteUrlError" />
        <span id="siteUrlError" class="field-error" aria-live="polite"></span>
      </div>
      <p id="shortcutFormStatus" class="form-status" role="status"></p>
      <div class="form-actions">
        <button id="cancelBtn" class="btn secondary" type="button">Cancel</button>
        <button id="saveBtn" class="btn primary" type="submit">Add</button>
      </div>
    </form>
  </div>
  <script src="shared.js"></script>
  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
